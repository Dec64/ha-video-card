name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: card

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: stream-card-dist
          path: |
            card/dist/*.js
            card/dist/*.js.map

  e2e:
    name: E2E (Chromium + MSE shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shim
          path: card/playwright-report/

  e2e-chrome:
    name: E2E (Google Chrome, real decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npx playwright test
        env:
          REAL_CODECS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chrome
          path: card/playwright-report/
