name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: card

jobs:
  check:
    timeout-minutes: 45
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: stream-card-dist
          path: |
            card/dist/*.js
            card/dist/*.js.map
            card/dist/*.txt

  e2e:
    timeout-minutes: 45
    name: E2E (Chromium + MSE shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 25
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shim
          path: card/playwright-report/

  e2e-chrome:
    timeout-minutes: 45
    name: E2E (Google Chrome, real decode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 25
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npx playwright test
        env:
          REAL_CODECS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chrome
          path: card/playwright-report/

  e2e-ha:
    timeout-minutes: 45
    name: E2E (real Home Assistant + Bubble Card)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/setup-ffmpeg
        timeout-minutes: 25
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e:ha
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ha
          path: |
            card/playwright-report/
            card/.ha-test/hass.log
