name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run check
      - run: cd dist && zip -r ../stream-card.zip . -i '*.js' '*.txt'
      - uses: softprops/action-gh-release@v2
        with:
          # The zip is for HACS; the individual files let Home Assistant's Downloader fetch them.
          files: |
            card/stream-card.zip
            card/dist/*.js
            card/dist/*.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
